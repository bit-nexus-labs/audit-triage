[package]
name = "triage-cli"
version = "0.1.0"
edition = "2021"
default-run = "audit-triage"

[[bin]]
name = "audit-triage"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1"
anchor-lint = { path = "../anchor-lint" }
triage-core = { path = "../triage-core" }

[dev-dependencies]
assert_cmd = "2"

